<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyTube - Ad-Free Video</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Styles for Mobile App Look */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for horizontal scrolling categories */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Truncate multi-line text */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Full Screen Player View */
        #playerView {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            z-index: 50;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white">

    <!-- Header Section (Mobile App Style) -->
    <header class="fixed top-0 w-full bg-[#0f0f0f] z-40 border-b border-gray-800">
        <div class="flex justify-between items-center p-4">
            <div class="flex items-center gap-2 text-xl font-bold cursor-pointer" onclick="goHome()">
                <i class="fa-brands fa-youtube text-red-600 text-3xl"></i>
                <span class="tracking-tight text-xl">MyTube</span>
            </div>
            <div class="flex items-center gap-5">
                <i class="fa-solid fa-magnifying-glass text-xl cursor-pointer hover:text-gray-300" onclick="toggleSearch()"></i>
                <!-- No Upload Option Included as requested -->
                <i class="fa-regular fa-circle-user text-2xl cursor-pointer"></i>
            </div>
        </div>
        
        <!-- Search Bar (Hidden by default) -->
        <div id="searchBar" class="hidden px-4 pb-3 flex gap-2 transition-all duration-300">
            <input type="text" id="searchInput" placeholder="ভিডিও, গান বা মুভি খুঁজুন..." class="w-full bg-gray-800 text-white rounded-full px-5 py-2 outline-none focus:ring-1 focus:ring-gray-500">
            <button onclick="performSearch()" class="bg-gray-800 px-5 rounded-full hover:bg-gray-700">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        
        <!-- Category Chips -->
        <div class="flex gap-3 px-4 pb-3 overflow-x-auto no-scrollbar whitespace-nowrap" id="categoryChips">
            <button class="bg-white text-black px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('All')">সব</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('Bengali Natok')">নাটক</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('Bengali Songs')">গান</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('Bengali Movies')">মুভি</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('Shorts')">শর্টস</button>
            <button class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition" onclick="searchCategory('News Live')">খবর</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="mt-28 mb-16" id="mainFeed">
        <!-- Loading Indicator -->
        <div id="loader" class="flex justify-center items-center py-32 hidden">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-gray-400"></i>
        </div>
        
        <!-- Video Grid -->
        <div id="videoList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-y-6 gap-x-4 pb-4">
            <!-- Videos will be injected here via JS -->
        </div>
    </main>

    <!-- Full Screen Player View -->
    <div id="playerView">
        <div class="sticky top-0 z-50 bg-black shadow-lg">
            <!-- Back button over player -->
            <button onclick="closePlayer()" class="absolute top-2 left-2 z-50 bg-black bg-opacity-60 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-opacity-90 transition">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            
            <!-- Player Iframe -->
            <div class="video-container" id="iframeContainer">
                <!-- Iframe injected here -->
            </div>
        </div>
        
        <!-- Video Details -->
        <div class="p-4 bg-[#0f0f0f]">
            <h1 id="playerTitle" class="text-lg sm:text-xl font-bold mb-2 leading-snug">Video Title</h1>
            <div class="flex items-center gap-3 mb-4 text-sm text-gray-400 font-medium">
                <span id="playerViews">0 views</span> • <span id="playerDate">Date</span>
            </div>
            
            <!-- Channel Info & Actions -->
            <div class="flex items-center justify-between border-t border-b border-gray-800 py-3 mb-4">
                <div class="flex items-center gap-3 flex-1">
                    <img id="playerChannelAvatar" src="" class="w-10 h-10 rounded-full object-cover bg-gray-800">
                    <div>
                        <h3 id="playerChannelName" class="font-bold text-white text-[15px]">Channel</h3>
                        <p class="text-xs text-gray-400">Subscriber hidden</p>
                    </div>
                </div>
                <button class="bg-white text-black px-4 py-2 rounded-full font-bold text-sm hover:bg-gray-200 transition">Subscribe</button>
            </div>
        </div>
        
        <!-- Suggested Videos in Player -->
        <h3 class="px-4 font-bold text-lg mb-3">Up next</h3>
        <div id="suggestedVideos" class="flex flex-col gap-4 px-4 pb-20">
            <!-- Suggested videos injected here -->
        </div>
    </div>

    <!-- Bottom Navigation (Mobile Native Feel) -->
    <nav class="fixed bottom-0 w-full bg-[#0f0f0f] border-t border-gray-800 flex justify-around items-center py-2 pb-safe z-40">
        <button onclick="goHome()" class="flex flex-col items-center gap-1 text-white">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="searchCategory('YouTube Shorts')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-bolt text-xl"></i>
            <span class="text-[10px] font-medium">Shorts</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <i class="fa-solid fa-layer-group text-xl"></i>
            <span class="text-[10px] font-medium">Subscriptions</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-white transition">
            <i class="fa-regular fa-folder-open text-xl"></i>
            <span class="text-[10px] font-medium">Library</span>
        </button>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // Piped API - Open Source Privacy YouTube API (Blocks Ads & Trackers)
        // Array of API instances to fallback if one goes down
        const API_INSTANCES = [
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.in.projectsegfau.lt",
            "https://pipedapi.us.projectsegfau.lt",
            "https://pipedapi.adminforge.de",
            "https://piped-api.privacy.com.de",
            "https://pipedapi.tokhmi.xyz",
            "https://api.piped.projectsegfau.lt",
            "https://piped-api.garudalinux.org",
            "https://pipedapi.smnz.de",
            "https://piped-api.lunar.icu",
            "https://pipedapi.syncpundit.io"
        ]; 
        let currentVideos = [];

        // Fetch with timeout to prevent hanging on a slow/dead instance
        async function fetchWithTimeout(resource, options = {}) {
            const { timeout = 7000 } = options;
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(resource, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        // Helper function to fetch data with fallback instances
        async function fetchFromPiped(endpoint) {
            for (let api of API_INSTANCES) {
                try {
                    const response = await fetchWithTimeout(api + endpoint, { timeout: 7000 });
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (e) {
                    console.warn(`Failed fetching from ${api}, trying next...`);
                }
            }
            throw new Error("All API instances failed. Please try again later.");
        }

        // Utility: Format numbers (e.g., 1.2M, 15K)
        function formatViews(views) {
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'K';
            return views || 'Unknown';
        }

        // Utility: Format time (seconds to MM:SS)
        // Format time (seconds to MM:SS)
        function formatDuration(seconds) {
            if(!seconds) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if(h > 0) return `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            return `${m}:${s < 10 ? '0'+s : s}`;
        }

        // Fetch Trending Videos on Load
        async function fetchTrending() {
            showLoader(true);
            try {
                const data = await fetchFromPiped('/trending?region=IN');
                currentVideos = data;
                renderVideos(data, 'videoList');
            } catch (error) {
                console.error("Error fetching:", error);
                document.getElementById('videoList').innerHTML = `<p class="text-center text-gray-400 py-10">সার্ভার বা ইন্টারনেট কানেকশন সমস্যা। আবার চেষ্টা করুন।</p>`;
            }
            showLoader(false);
        }

        // Fetch Search Results
        async function fetchSearch(query) {
            showLoader(true);
            try {
                const data = await fetchFromPiped(`/search?q=${encodeURIComponent(query)}&filter=all`);
                const videos = data.items.filter(item => item.type === 'stream'); // Only videos
                currentVideos = videos;
                renderVideos(videos, 'videoList');
            } catch (error) {
                console.error("Search error:", error);
                document.getElementById('videoList').innerHTML = `<p class="text-center text-gray-400 py-10">সার্ভার সমস্যা, কিছু খুঁজে পাওয়া যায়নি।</p>`;
            }
            showLoader(false);
        }

        // Render HTML for Video Cards
        function renderVideos(videos, containerId, isSuggested = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if(!videos || videos.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-10 w-full col-span-full">কোনো ভিডিও পাওয়া যায়নি!</p>`;
                return;
            }

            videos.forEach(video => {
                if(!video.url.includes('/watch?v=')) return; 
                
                const videoId = video.url.split('v=')[1];
                const thumbnail = video.thumbnail || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                const avatar = video.uploaderAvatar || `https://placehold.co/100x100/1f1f1f/fff?text=${video.uploaderName?.charAt(0) || 'C'}`;
                
                let cardHTML = '';
                if(isSuggested) {
                    // Small Layout for Suggested Videos
                    cardHTML = `
                        <div class="flex gap-3 cursor-pointer" onclick="playVideo('${videoId}', '${escapeHtml(video.title)}', '${escapeHtml(video.uploaderName)}', '${video.views}', '${video.uploadedDate}', '${avatar}')">
                            <div class="relative w-[160px] h-[90px] flex-shrink-0 rounded-xl overflow-hidden bg-gray-800">
                                <img src="${thumbnail}" class="w-full h-full object-cover">
                                <span class="absolute bottom-1 right-1 bg-black bg-opacity-80 text-white text-xs px-1 rounded">${formatDuration(video.duration)}</span>
                            </div>
                            <div class="flex flex-col pt-1">
                                <h3 class="text-sm font-bold line-clamp-2 text-white leading-tight">${video.title}</h3>
                                <p class="text-[12px] text-gray-400 mt-1">${video.uploaderName}</p>
                                <p class="text-[12px] text-gray-400">${formatViews(video.views)} views • ${video.uploadedDate || 'Recently'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    // Big Layout for Main Feed
                    cardHTML = `
                        <div class="flex flex-col gap-3 cursor-pointer mb-2 sm:mb-4" onclick="playVideo('${videoId}', '${escapeHtml(video.title)}', '${escapeHtml(video.uploaderName)}', '${video.views}', '${video.uploadedDate}', '${avatar}')">
                            <div class="relative w-full aspect-video sm:rounded-xl overflow-hidden bg-gray-800">
                                <img src="${thumbnail}" class="w-full h-full object-cover">
                                <span class="absolute bottom-2 right-2 bg-black bg-opacity-80 text-white text-xs px-1.5 py-0.5 rounded font-medium">${formatDuration(video.duration)}</span>
                            </div>
                            <div class="flex gap-3 px-3 sm:px-1">
                                <img src="${avatar}" class="w-10 h-10 rounded-full object-cover mt-1 bg-gray-800">
                                <div class="flex flex-col pr-4">
                                    <h3 class="text-[15px] font-semibold leading-tight line-clamp-2 text-white">${video.title}</h3>
                                    <p class="text-sm text-gray-400 mt-1">${video.uploaderName} • ${formatViews(video.views)} views • ${video.uploadedDate || 'Recently'}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML += cardHTML;
            });
        }

        // Play Video Function
        function playVideo(id, title, channel, views, date, avatar) {
            document.getElementById('playerView').style.display = 'block';
            document.body.style.overflow = 'hidden'; 

            // YouTube No-Cookie ensures no targeted tracking and mostly ad-free experience.
            const iframeHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&iv_load_policy=3" allow="autoplay; fullscreen; encrypted-media"></iframe>`;
            document.getElementById('iframeContainer').innerHTML = iframeHTML;

            // Populate Metadata
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerChannelName').innerText = channel;
            document.getElementById('playerViews').innerText = formatViews(views) + ' views';
            document.getElementById('playerDate').innerText = date !== 'undefined' ? date : '';
            document.getElementById('playerChannelAvatar').src = avatar;

            // Load Random Suggested Videos
            const shuffled = [...currentVideos].sort(() => 0.5 - Math.random()).slice(0, 10);
            renderVideos(shuffled, 'suggestedVideos', true);
            
            document.getElementById('playerView').scrollTop = 0;
        }

        // Close Fullscreen Player
        function closePlayer() {
            document.getElementById('playerView').style.display = 'none';
            document.body.style.overflow = 'auto'; 
            document.getElementById('iframeContainer').innerHTML = ''; // Stop Audio
        }

        // Toggle Search Input
        function toggleSearch() {
            const searchBar = document.getElementById('searchBar');
            searchBar.classList.toggle('hidden');
            if(!searchBar.classList.contains('hidden')){
                document.getElementById('searchInput').focus();
            }
        }

        // Search Action
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                fetchSearch(query);
                updateCategoryChips('none');
                document.getElementById('searchBar').classList.add('hidden');
            }
        }

        // Trigger search on 'Enter' key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        // Search via Category Buttons
        function searchCategory(query) {
            updateCategoryChips(query);
            if(query === 'All') fetchTrending();
            else fetchSearch(query);
        }

        // Reset to Home state
        function goHome() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchBar').classList.add('hidden');
            closePlayer();
            searchCategory('All');
        }

        // Visual Update for Active Category Chip
        function updateCategoryChips(activeQuery) {
            const buttons = document.getElementById('categoryChips').getElementsByTagName('button');
            for(let btn of buttons) {
                if(btn.innerText.includes(activeQuery) || (activeQuery === 'All' && btn.innerText === 'সব')) {
                    btn.className = "bg-white text-black px-4 py-1.5 rounded-lg text-sm font-medium transition";
                } else {
                    btn.className = "bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-sm font-medium transition";
                }
            }
        }

        // Loading Spinner Toggle
        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
            if(show) document.getElementById('videoList').innerHTML = '';
        }

        // Sanitize Strings for HTML Injection
        function escapeHtml(unsafe) {
            if(!unsafe) return '';
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // App Initialization
        window.onload = () => {
            fetchTrending();
        };
    </script>
</body>
</html>
