<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Photo Studio Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#09090b', 800: '#121216', 700: '#1e1e24' },
                        accent: '#a3e635'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center; align-items: center; background: white !important; }
        }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen font-sans selection:bg-accent selection:text-black">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-dark-800/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-accent text-black p-2 rounded-xl font-bold flex items-center justify-center w-10 h-10 shadow-lg">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Passport Studio <span class="text-accent">Pro</span></h1>
            </div>
            <span class="text-xs px-3 py-1 bg-dark-700 border border-gray-700 rounded-full text-gray-400">100% Stable Studio</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel -->
            <div class="lg:col-span-5 space-y-6">
                <!-- Step 1 -->
                <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6 shadow-xl">
                    <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-accent text-black flex items-center justify-center text-xs font-bold">1</span>
                        Upload Photo
                    </h2>
                    <label class="border-2 border-dashed border-gray-700 hover:border-accent transition rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer bg-dark-900/50">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                        <span class="text-sm font-medium text-gray-300">Click to upload photo</span>
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                    </label>
                </div>

                <!-- Step 2 -->
                <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <h2 class="text-base font-semibold mb-2 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-accent text-black flex items-center justify-center text-xs font-bold">2</span>
                        Background & Photo Adjustments
                    </h2>

                    <!-- Background Color Palette -->
                    <div>
                        <label class="text-xs font-medium text-gray-400 block mb-2">Background / Canvas Color</label>
                        <div class="flex gap-3">
                            <button onclick="setBgColor('#ffffff')" class="w-8 h-8 rounded-full bg-white border-2 border-gray-400 shadow"></button>
                            <button onclick="setBgColor('#2563eb')" class="w-8 h-8 rounded-full bg-blue-600 shadow"></button>
                            <button onclick="setBgColor('#dc2626')" class="w-8 h-8 rounded-full bg-red-600 shadow"></button>
                            <button onclick="setBgColor('#059669')" class="w-8 h-8 rounded-full bg-emerald-600 shadow"></button>
                            <button onclick="setBgColor('#1e293b')" class="w-8 h-8 rounded-full bg-slate-800 shadow"></button>
                        </div>
                    </div>

                    <div class="space-y-3 pt-2 border-t border-gray-700/50">
                        <div>
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Brightness</span>
                                <span id="brightVal">100%</span>
                            </div>
                            <input type="range" id="brightnessRange" min="50" max="150" value="100" class="w-full accent-accent bg-dark-900 rounded-lg h-2">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Contrast</span>
                                <span id="contrastVal">100%</span>
                            </div>
                            <input type="range" id="contrastRange" min="50" max="150" value="100" class="w-full accent-accent bg-dark-900 rounded-lg h-2">
                        </div>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <h2 class="text-base font-semibold mb-2 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-accent text-black flex items-center justify-center text-xs font-bold">3</span>
                        Paper Size & Copies
                    </h2>
                    <div>
                        <label class="text-xs font-medium text-gray-400 block mb-1">Paper Size</label>
                        <select id="paperSizeSelect" class="w-full bg-dark-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-200">
                            <option value="4x6">4 x 6 inch Photo Paper</option>
                            <option value="5x7">5 x 7 inch Photo Paper</option>
                            <option value="a4">A4 Sheet</option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between bg-dark-900 p-3 rounded-xl border border-gray-800">
                        <span class="text-sm font-medium">Total Copies:</span>
                        <div class="flex items-center gap-3">
                            <button onclick="adjustCopies(-1)" class="w-8 h-8 bg-dark-700 hover:bg-gray-700 rounded-lg font-bold">-</button>
                            <span id="copyCount" class="font-bold text-base w-6 text-center">8</span>
                            <button onclick="adjustCopies(1)" class="w-8 h-8 bg-dark-700 hover:bg-gray-700 rounded-lg font-bold">+</button>
                        </div>
                    </div>

                    <button onclick="window.print()" class="w-full bg-accent hover:bg-lime-500 text-black font-bold py-3 rounded-xl transition shadow-lg">
                        <i class="fa-solid fa-print"></i> Print / Save PDF
                    </button>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6 shadow-xl flex flex-col items-center">
                    <h3 class="text-sm font-medium text-gray-400 mb-4 self-start">Single Passport Preview (3.5cm x 4.5cm)</h3>
                    <div class="relative bg-dark-900 border border-gray-700 rounded-xl overflow-hidden p-2 flex items-center justify-center" style="width: 210px; height: 270px;">
                        <canvas id="passportCanvas" class="w-full h-full object-cover rounded-lg"></canvas>
                        <div id="placeholderText" class="absolute text-center text-xs text-gray-500 p-4">
                            <i class="fa-regular fa-image text-2xl mb-2 block"></i>
                            Upload a photo
                        </div>
                    </div>
                </div>

                <div class="bg-dark-800 border border-gray-800 rounded-2xl p-6 shadow-xl flex-1 flex flex-col">
                    <h3 class="text-sm font-medium text-gray-400 mb-4">Print Grid Preview (<span id="paperNameDisplay">4 x 6 inch</span>)</h3>
                    <div id="printArea" class="bg-white rounded-xl p-4 shadow-inner flex-1 overflow-auto min-h-[320px] flex items-center justify-center">
                        <div id="gridContainer" class="grid grid-cols-4 gap-2 w-fit">
                            <div class="text-gray-400 text-xs text-center col-span-4 py-16">Sheet preview will appear here</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script -->
    <script>
        let currentImage = null;
        let copiesCount = 8;
        let bgColor = '#ffffff';
        let brightness = 100;
        let contrast = 100;

        const imageInput = document.getElementById('imageInput');
        const passportCanvas = document.getElementById('passportCanvas');
        const ctx = passportCanvas.getContext('2d');
        const placeholderText = document.getElementById('placeholderText');
        const gridContainer = document.getElementById('gridContainer');
        const copyCountSpan = document.getElementById('copyCount');
        const paperSizeSelect = document.getElementById('paperSizeSelect');
        const paperNameDisplay = document.getElementById('paperNameDisplay');

        passportCanvas.width = 350;
        passportCanvas.height = 450;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        placeholderText.style.display = 'none';
                        processAndRender();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('brightnessRange').addEventListener('input', (e) => {
            brightness = e.target.value;
            document.getElementById('brightVal').innerText = brightness + '%';
            if (currentImage) processAndRender();
        });

        document.getElementById('contrastRange').addEventListener('input', (e) => {
            contrast = e.target.value;
            document.getElementById('contrastVal').innerText = contrast + '%';
            if (currentImage) processAndRender();
        });

        paperSizeSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === '4x6') {
                paperNameDisplay.innerText = '4 x 6 inch';
                gridContainer.style.gridTemplateColumns = 'repeat(4, minmax(0, 1fr))';
            } else if (val === '5x7') {
                paperNameDisplay.innerText = '5 x 7 inch';
                gridContainer.style.gridTemplateColumns = 'repeat(5, minmax(0, 1fr))';
            } else {
                paperNameDisplay.innerText = 'A4 Size';
                gridContainer.style.gridTemplateColumns = 'repeat(6, minmax(0, 1fr))';
            }
            if (currentImage) renderGrid();
        });

        function setBgColor(color) {
            bgColor = color;
            if (currentImage) processAndRender();
        }

        function adjustCopies(val) {
            copiesCount += val;
            if (copiesCount < 1) copiesCount = 1;
            if (copiesCount > 40) copiesCount = 40;
            copyCountSpan.innerText = copiesCount;
            if (currentImage) renderGrid();
        }

        function processAndRender() {
            if (!currentImage) return;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, passportCanvas.width, passportCanvas.height);

            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%)`;

            const hRatio = passportCanvas.width / currentImage.width;
            const vRatio = passportCanvas.height / currentImage.height;
            const ratio = Math.max(hRatio, vRatio);
            
            const centerShiftX = (passportCanvas.width - currentImage.width * ratio) / 2;
            const centerShiftY = (passportCanvas.height - currentImage.height * ratio) / 2;

            ctx.drawImage(currentImage, 0, 0, currentImage.width, currentImage.height,
                          centerShiftX, centerShiftY, currentImage.width * ratio, currentImage.height * ratio);
            
            ctx.filter = 'none';
            renderGrid();
        }

        function renderGrid() {
            gridContainer.innerHTML = '';
            const dataURL = passportCanvas.toDataURL('image/jpeg', 0.95);

            for (let i = 0; i < copiesCount; i++) {
                const imgElem = document.createElement('img');
                imgElem.src = dataURL;
                imgElem.className = 'w-[75px] h-[95px] object-cover border border-gray-200 shadow-sm rounded';
                gridContainer.appendChild(imgElem);
            }
        }
    </script>
</body>
</html>
